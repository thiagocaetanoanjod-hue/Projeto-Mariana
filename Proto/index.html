<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Atrasos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Registro de Atrasos</h1>
        <a href="relatorio.html" class="link-admin">Relatório</a>
    </header>

    <main class="container">
        <div class="card">
            <img src="images.jpg" alt="Logo senai" class="hero-img">
            
            <form class="formulario" id="formulario-registro">
                <div class="input-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>

                <button type="submit" class="btn-submit">Enviar Registro</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Senai. Todos os direitos reservados.</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
